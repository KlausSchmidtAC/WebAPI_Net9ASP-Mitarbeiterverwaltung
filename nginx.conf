http { 
    # Verbindungs-Pooling zu Backends (statt neue TCP-Verbindung pro Request)
    upstream webapi_Net9 {
        least_conn;
        server backend:5100 max_fails=3 fail_timeout=30s;
        keepalive 64;        # max. 64 persistente Verbindungen pro Worker zum Backend
    }

    server {
        listen 80;
        server_name webapi_Net9_proxy;

        # Puffer-Optimierung: Response im nginx-Speicher puffern statt sofort weiterleiten
        proxy_buffering        on;
        proxy_buffer_size      4k;
        proxy_buffers          8 8k;

        location / {
            proxy_pass http://webapi_Net9;
            proxy_http_version 1.1;              # HTTP/1.1 für keepalive zum Backend
            proxy_set_header Connection "";      # Connection-Header löschen → keepalive aktivieren
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout  10s;
            proxy_read_timeout     20s;  # < DB Connection Timeout (25s) → DB gibt vor nginx auf
        }
    }
}

worker_processes auto;

events {
        multi_accept on;
        worker_connections 4096;   # erhöht von 1024 → 4096 (5 Backends × 500 VUs)
       }
    