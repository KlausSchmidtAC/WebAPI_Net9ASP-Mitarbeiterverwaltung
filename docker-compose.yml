
# ─────────────────────────────────────────────────────────────
# docker-compose.yml  –  Stage 2: Backend + MySQL
# Start:  docker-compose up
# Stop:   docker-compose down
# ─────────────────────────────────────────────────────────────

services:
 # ----- Nginx 
  nginx: 
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"   # Expose Nginx on port 80 (accessible at localhost:80)
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro  # Mount custom Nginx config (read-only)
    depends_on:
      backend:
        condition: service_healthy  # Nginx starts only after Backend is healthy
      
  # ── Backend ───────────────────────────────────────────────
  backend: 
    # Image name (built locally and tagged)
    image: webapi-backend:latest

    # Build image directly from Dockerfile:
    build:
      context: .
      dockerfile: Dockerfile

    # container_name:   webapi_backend   # unique container name(optional, but helpful for debugging)

    # Host-Port : Container-Port
    # Accessible from outside (Windows/Browser) at localhost:5100
    # ports:
    # - "5100:5100"   // Port 5100 is only needed for internal healthcheck, not for regular access from outside (nginx proxy)

    # Environment variables – determines which appsettings.{ENV}.json is loaded
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker

    # Backend starts only after MySQL is healthy
    depends_on:
      mysql:
        condition: service_healthy
      seq: 
        condition: service_started

    # Healthcheck: /health checks app + DB
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── MySQL ──────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    command: --max_connections=250
    # Backend reaches MySQL internally via Docker DNS: "mysql:3306"
    # 3307 externally (in case port 3306 is occupied by local MySQL)
    ports:
      - "3307:3306"

    environment:
      - MYSQL_ROOT_PASSWORD=SecureRootPw2026!
      - MYSQL_DATABASE=employees
      - MYSQL_USER=webapi_user
      - MYSQL_PASSWORD=SecureWebAPI2026!

    # Data persists when container is restarted
    volumes:
      - mysql_data:/var/lib/mysql

    # Docker waits until MySQL is truly ready (not just started)
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pSecureRootPw2026!"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  
  # ── Seq ──────────────────────────────────────────────────
  seq:
    image: datalust/seq:latest
    container_name: seq_logs
    environment: 
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=Admin2026!
    ports:
      - "5341:5341"
      - "8081:80"
    volumes: 
      - seq_data:/data

# ── Volumes ────────────────────────────────────────────────
volumes:
  mysql_data:   # persistent MySQL data
  seq_data:     # persistent Seq data